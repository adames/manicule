# Fetch the pool from a runner and say what it could not reach. Builds to
# /tmp and deploys nothing: the point is the last "skipped" line.
name: check
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run manicule.py posts feeds.opml -o /tmp/check.json 2>&1 | grep -E "^  (skip|note|skipped)" || echo "nothing skipped"
