# Fetch the feed from a runner and say what it could not reach. Builds to
# /tmp and deploys nothing: the point is the last "skipped" line. A runner
# reaches the web from a different address than a laptop does, and some hosts
# answer it differently, so a source is not verified until this has run.
#
# Run it by hand, on whatever branch carries the sources you are checking:
#
#     gh workflow run check.yml --ref your-branch
#
# It ran on every claude/** push while the feed was being rebuilt, which was
# right then and noise now: the feed changes a few sources at a time.
name: check
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0   # no floating major tag after v7
      - run: uv python install 3.12
      - run: uv sync
      # Two steps, not one pipeline: `cmd | grep || echo` cannot fail, so a
      # build that died reported "nothing skipped" and went green. It hid a
      # wrong filename here for an afternoon. The fetch has to be able to
      # fail; only the grep finding nothing is allowed to be fine.
      - run: uv run manicule.py posts feeds.opml -o /tmp/check.json 2>&1 | tee /tmp/check.log
      - run: grep -E "^  (skip|note|skipped)" /tmp/check.log || echo "nothing skipped"
