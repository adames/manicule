# Refresh the demo corpus daily and publish site/ to GitHub Pages.
# If a run fails, yesterday's corpus keeps serving — nothing to babysit.
name: corpus
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: corpus
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run pytest -q && node --test tests/rank.test.mjs
      - run: uv run manicule.py corpus feeds.opml -o site/corpus.json
      - name: commit corpus
        run: |
          git config user.name "manicule-bot"
          git config user.email "manicule-bot@users.noreply.github.com"
          git add site/corpus.json
          git diff --cached --quiet || git commit -m "corpus: $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
