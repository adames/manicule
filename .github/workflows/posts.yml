# Refresh the demo's posts daily and publish site/ to GitHub Pages.
# If a run fails, yesterday's file keeps serving — nothing to babysit.
name: posts
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: posts
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0   # no floating major tag after v7
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: uv run pytest -q && node --test tests/rank.test.mjs
      - run: uv run manicule.py posts feeds.opml -o site/posts.json
      # A push that lands while this is building makes the plain push here
      # rejected, and the whole run with it. Rebase onto whatever arrived; the
      # only files this commit touches are the two build outputs, and for
      # those the build that just finished is the one to keep (-X theirs is
      # "the commit being replayed", which is this one).
      - name: commit the posts
        run: |
          git config user.name "manicule-bot"
          git config user.email "manicule-bot@users.noreply.github.com"
          git add site/posts.json site/vectors.bin
          git diff --cached --quiet || git commit -m "posts: $(date -u +%F)"
          git pull --rebase -X theirs
          git push
      # Stamp every local asset with the commit, so a browser can never mix a
      # new page with a script it cached an hour ago.
      #
      # After the commit above, on purpose: the stamp lives in the deployed
      # artifact and never in git. What is committed keeps bare href="manicule.css",
      # so the only daily diff is the two build outputs. Stamping before the
      # commit would rewrite every html file on every build, and the stamp would
      # have to be stripped again to keep the diff readable. So the html on Pages
      # is not byte-for-byte the html in the repo, and that is the intent.
      - name: stamp the assets
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i -E 's/(href="manicule\.css|src="(rank|shell|feed|method)\.js)"/\1?v='"$v"'"/g' site/*.html
          grep -o 'v=[0-9a-f]*' site/index.html | head -1
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
